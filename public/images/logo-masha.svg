<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Мария Ермолаева">
  <circle cx="64" cy="64" r="62" fill="#FAF6F1" stroke="#B08D57" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#EBD9D1" stroke-width="1.5"/>

  <!-- Monogram ME -->
  <text
    x="64"
    y="58"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="600"
    fill="#2E2A27"
    letter-spacing="1.5"
  >ME</text>

  <!-- Line-drawn women's hands (gentle care gesture) -->
