      C30 82 34 78 40 78
      C44 78 46 80 47 84
      L48 92
      C45 96 40 98 36 96
      C32 94 30 90 28 88Z"/>
    <path d="M40 78 C41 74 43 72 45 72 C47 72 48 74 48 77"/>
    <path d="M43 78 C45 73 48 71 50 72 C52 73 52 76 51 79"/>
    <path d="M46 80 C49 76 52 75 54 77 C55 79 54 82 52 84"/>
    <path d="M47 84 C50 82 54 83 55 86 C56 88 54 90 51 90"/>

    <!-- Right hand, palm up, mirroring -->
    <path d="M100 88
      C98 82 94 78 88 78
      C84 78 82 80 81 84
      L80 92
      C83 96 88 98 92 96
      C96 94 98 90 100 88Z"/>
    <path d="M88 78 C87 74 85 72 83 72 C81 72 80 74 80 77"/>
    <path d="M85 78 C83 73 80 71 78 72 C76 73 76 76 77 79"/>
    <path d="M82 80 C79 76 76 75 74 77 C73 79 74 82 76 84"/>
    <path d="M81 84 C78 82 74 83 73 86 C72 88 74 90 77 90"/>

    <!-- Soft meeting curve between hands -->
    <path d="M52 90 C58 86 70 86 76 90" stroke="#C89F7E" stroke-width="1.3"/>
  </g>
</svg>
